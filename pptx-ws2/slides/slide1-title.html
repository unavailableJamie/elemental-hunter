<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #ffffff;
}
.accent-bar { width: 100%; height: 8pt; background: #1A6FD4; flex-shrink: 0; }
.main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 80pt; gap: 0;
}
.tag {
  font-size: 9pt; font-weight: 700; color: #94A3B8;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin: 0 0 12pt 0;
}
h1 {
  font-size: 40pt; color: #1E2A38; margin: 0; font-weight: 800;
  text-align: center; line-height: 1.1;
}
.sub {
  font-size: 15pt; color: #6B7A8D; margin: 8pt 0 0 0;
  font-style: italic; text-align: center;
}
.divider {
  width: 64pt; height: 3pt; background: #1A6FD4;
  border-radius: 2pt; margin: 20pt 0;
}
.phases-row { display: flex; gap: 16pt; margin: 0; }
.phase-chip {
  display: flex; align-items: center; gap: 6pt;
  padding: 5pt 12pt; border-radius: 20pt;
}
.phase-chip.g { background: #ECFDF5; border: 1.5pt solid #059669; }
.phase-chip.o { background: #FEF3E4; border: 1.5pt solid #E07B1A; }
.phase-chip.p { background: #F5F3FF; border: 1.5pt solid #7C3AED; }
.phase-chip .pct { font-size: 13pt; font-weight: 800; margin: 0; }
.phase-chip.g .pct { color: #059669; }
.phase-chip.o .pct { color: #E07B1A; }
.phase-chip.p .pct { color: #7C3AED; }
.phase-chip .lbl { font-size: 10.5pt; color: #1E2A38; margin: 0; font-weight: 600; }
.footer {
  width: 100%; height: 16pt; background: #F1F5F9; flex-shrink: 0;
  display: flex; align-items: center; padding: 0 18pt; box-sizing: border-box;
  justify-content: space-between;
}
.footer p { font-size: 8pt; color: #94A3B8; margin: 0; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="main">
  <p class="tag">AI-Assisted Prototype Workflow</p>
  <h1>Quy trình làm Prototype bằng AI</h1>
  <p class="sub">Từ khung tổng thể đến sản phẩm hoàn chỉnh</p>
  <div class="divider"></div>
  <div class="phases-row">
    <div class="phase-chip g"><p class="pct">60%</p><p class="lbl">Khung ban đầu</p></div>
    <div class="phase-chip o"><p class="pct">+20%</p><p class="lbl">Đi sâu từng Scene</p></div>
    <div class="phase-chip p"><p class="pct">+20%</p><p class="lbl">Fine-tune bằng tay</p></div>
  </div>
</div>
<div class="footer">
  <p>AI Prototype Workflow</p>
  <p>CCN2 · 2026</p>
</div>
</body>
</html>
