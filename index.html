<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemental Quest Board Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
<style>
  /* Subtle "breathing" effect for UI panels */
  @keyframes panel-zoom {
    0% { transform: scale(1.0); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1.0); }
  }

  /* More pronounced "pulse" effect for game pieces */
  @keyframes token-zoom {
    0% { transform: scale(0.9); }
    50% { transform: scale(1.05); }
    100% { transform: scale(0.9); }
  }

  /* Ultimate Ready Attention-Grabbing Animation */
  @keyframes ultimate-pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 rgba(168, 85, 247, 0); }
    50% { transform: scale(1.1); box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); border-color: rgba(168, 85, 247, 1); }
    100% { transform: scale(1); box-shadow: 0 0 0 rgba(168, 85, 247, 0); }
  }

  .animate-ultimate-ready {
    animation: ultimate-pulse 2s infinite ease-in-out;
  }

  @keyframes ultimate-slam {
    0%   { transform: scale(1.1); }
    15%  { transform: scale(1.45); box-shadow: 0 0 50px rgba(99,102,241,1), 0 0 100px rgba(99,102,241,0.6); }
    35%  { transform: scale(0.95); }
    55%  { transform: scale(1.2); }
    75%  { transform: scale(1.05); }
    100% { transform: scale(1.1); }
  }

  .animate-ultimate-slam {
    animation: ultimate-slam 0.7s ease-out 1 forwards;
  }

  @keyframes panel-shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    10%  { transform: translateX(-10px) rotate(-1.5deg); }
    25%  { transform: translateX(9px) rotate(1deg); }
    40%  { transform: translateX(-7px) rotate(-0.8deg); }
    55%  { transform: translateX(5px) rotate(0.5deg); }
    70%  { transform: translateX(-3px); }
    85%  { transform: translateX(2px); }
  }

  /* Element Queue Specific Animations */
  @keyframes element-slide-in {
    0% { 
      opacity: 0; 
      transform: translateX(20px); 
    }
    100% { 
      opacity: 1; 
      transform: translateX(0); 
    }
  }

  /* New Reward Popup Animation */
  @keyframes reward-popup {
    0% { transform: scale(0.5); opacity: 0; }
    20% { transform: scale(1.2); opacity: 1; }
    30% { transform: scale(1.0); opacity: 1; }
    80% { transform: scale(1.0); opacity: 1; }
    100% { transform: translateY(-40px) scale(0.8); opacity: 0; }
  }

  /* Streak Bonus Center Popup with High-Intensity Impact */
  @keyframes glow-spread {
    0% { 
      transform: scale(0.2) rotate(-15deg); 
      opacity: 0; 
      text-shadow: 0 0 0 rgba(255, 255, 255, 0);
    }
    10% {
      transform: scale(1.6) rotate(5deg);
      opacity: 1;
      text-shadow: 0 0 40px rgba(255, 255, 255, 1), 0 0 80px rgba(251, 191, 36, 0.8);
    }
    15% {
      transform: scale(1.4) rotate(-3deg);
      text-shadow: 0 0 60px rgba(255, 255, 255, 1), 0 0 120px rgba(251, 191, 36, 1);
    }
    20% { 
      transform: scale(1.3) rotate(0deg); 
      opacity: 1; 
      text-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 0 100px rgba(251, 191, 36, 0.6); 
    }
    85% { 
      transform: scale(1.0) translateY(0); 
      opacity: 1; 
      text-shadow: 0 0 30px rgba(251, 191, 36, 0.5); 
    }
    100% { 
      transform: scale(1.5) translateY(-50px); 
      opacity: 0; 
      text-shadow: 0 0 150px rgba(251, 191, 36, 0); 
    }
  }

  /* Floating Animation for Kick/Streak/SP labels - Duration increased to 3s */
  @keyframes float-up-impact {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    15% { opacity: 1; transform: translateY(-20px) scale(1.2); }
    30% { opacity: 1; transform: translateY(-25px) scale(1.0); }
    100% { opacity: 0; transform: translateY(-100px) scale(1.0); }
  }

  /* Intense Kick Animation */
  @keyframes kick-impact {
    0% { opacity: 0; transform: scale(0); filter: blur(10px); }
    15% { opacity: 1; transform: scale(1.5); filter: blur(0); }
    25% { transform: scale(1.0) rotate(-5deg); }
    80% { opacity: 1; transform: scale(1.0) rotate(5deg); }
    100% { opacity: 0; transform: scale(0.8) translateY(-40px); }
  }

  @keyframes tooltip-fade-in {
    from { opacity: 0; transform: scale(0.95) translateY(5px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .element-item-enter {
    animation: element-slide-in 0.5s ease-out forwards;
  }

  .animate-reward-popup {
    animation: reward-popup 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .animate-glow-spread {
    animation: glow-spread 1.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .animate-float-up-impact {
    animation: float-up-impact 3s ease-out forwards;
  }

  .animate-kick-label {
    animation: kick-impact 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .ultimate-tooltip {
    animation: tooltip-fade-in 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .gradient-text-stroke {
    background: linear-gradient(to right, #ef4444, #3b82f6, #22c55e, #FBBF24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1.5px #1a1a1a;
    paint-order: stroke fill;
  }

  .streak-impact {
    background: linear-gradient(to bottom, #FFF7AD 0%, #FFFFFF 20%, #FBBF24 45%, #B45309 55%, #78350F 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 4px #000000;
    filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)) 
            drop-shadow(0 10px 25px rgba(0, 0, 0, 0.9));
    paint-order: stroke fill;
  }

  /* SP floating text - stroke thickness reduced for clarity */
  .sp-floating-text {
    color: #2563EB;
    text-shadow: 0 0 10px rgba(59, 130, 246, 0.3), 0 2px 4px rgba(0,0,0,0.3);
    -webkit-text-stroke: 0.3px rgba(255,255,255,0.7);
  }

  /* Ultimate Activation Feedback Gradient */
  .ultimate-activation-text {
    background: linear-gradient(45deg, #ef4444, #3b82f6, #22c55e, #FBBF24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 3px #000000;
    filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.5));
    paint-order: stroke fill;
  }

  .combo-text-stroke {
    -webkit-text-stroke: 3px #1F1F1F;
    paint-order: stroke fill;
  }

  @keyframes combo-slam {
    0% { transform: scale(3); opacity: 0; filter: blur(20px); }
    10% { transform: scale(1); opacity: 1; filter: blur(0); }
    85% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.8) translateY(-100px); opacity: 0; }
  }

  @keyframes fade-in-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes text-blink-lock-unlock {
    0%, 100% { color: #71717a; } /* zinc-500 */
    50% { color: #ffffff; } /* white */
  }

  .animate-combo-slam {
    animation: combo-slam 3s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  }

  .animate-fade-in-up {
    animation: fade-in-up 0.5s ease-out forwards;
  }

  .animate-text-blink {
    animation: text-blink-lock-unlock 1.5s infinite ease-in-out;
  }

  @keyframes floating-damage {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    50% { transform: translateY(-20px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-40px) scale(1); opacity: 0; }
  }

  .animate-floating-damage {
    animation: floating-damage 1.5s ease-out forwards;
  }

  @keyframes ultpulse {
    0%, 100% { box-shadow: 0 0 16px rgba(124,58,237,.75), 0 0 32px rgba(124,58,237,.35); }
    50%       { box-shadow: 0 0 28px rgba(167,139,250,1),  0 0 56px rgba(124,58,237,.65); }
  }

  /* Affinity-colored pulse for Ultimate button — color set via inline border/box-shadow */
  @keyframes affinity-pulse {
    0%, 100% { transform: scale(1);    opacity: 1; }
    50%       { transform: scale(1.07); opacity: 0.95; }
  }

  /* Pulsing radial glow backdrop behind ult button when canActivate */
  @keyframes ult-glow-pulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%       { opacity: 1;   transform: scale(1.18); }
  }

  /* Chibi tooltip slide-in from right (for P1, panel appears to the left) */
  @keyframes slide-in-from-right {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  /* Chibi tooltip slide-in from left (for P2, panel appears to the right) */
  @keyframes slide-in-from-left {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes chibi-float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-8px); }
  }
  .animate-chibi-float {
    animation: chibi-float 2s ease-in-out infinite;
  }

  @keyframes chibi-turn-flash {
    0%   { transform: scale(1);    filter: brightness(1); }
    20%  { transform: scale(1.18); filter: brightness(1.8) drop-shadow(0 0 12px rgba(255,255,255,0.9)); }
    100% { transform: scale(1);    filter: brightness(1); }
  }
  .animate-chibi-turn-flash {
    animation: chibi-turn-flash 0.6s ease-out forwards;
  }
</style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-800">
    <div id="root"></div>

  <script type="module" src="/index.tsx"></script>
</body>
</html>
